    <rect x="264" y="98" width="150" height="150" rx="30" fill="#3D6497"/>
    <rect x="98" y="264" width="150" height="150" rx="30" fill="#3D6497"/>
    <rect x="264" y="264" width="150" height="150" rx="30" fill="#79A2D6"/>
  </g>
</svg>
